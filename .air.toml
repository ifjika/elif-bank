root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Build the API Gateway server binary into tmp/ (Windows .exe)
  cmd = "go build -o ./tmp/api-gateway.exe ./apps/api-gateway/cmd/server"
  bin = "./tmp/api-gateway.exe"
  delay = 500
  exclude_dir = ["apps/web-console", "deploy", "docs", "tmp", ".git", "node_modules", "dist", "bin"]
  exclude_file = []
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = false
  follow_symlink = false
  include_dir = ["apps/api-gateway", "apps/core-ledger", "pkg"]
  include_ext = ["go", "mod", "work"]
  include_file = []
  kill_delay = "500ms"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
